name: Deploy My Coach LMS frontend to GitHub Pages

on:
  push:
    branches: [moodle-lms]
    paths:
      - "moodle-lms/frontend/**"
      - ".github/workflows/deploy-lms-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodle-lms/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moodle-lms/frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Public API origin (not a secret); the site is served from /<repo>/ on GitHub Pages.
          VITE_API_BASE_URL: https://my-coach-lms.onrender.com
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # GitHub Pages serves 404.html for unknown paths, so deep links and refreshes load the SPA.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: moodle-lms/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
